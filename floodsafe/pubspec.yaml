name: floodsafe
description: "FloodSafe Nairobi UI demonstration prototype."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Lora.txt
    - assets/fonts/OFL-Roboto.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
