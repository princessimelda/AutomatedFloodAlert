<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FloodSafe: local flood information, preparedness guidance and emergency support for Nairobi.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FloodSafe">


  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/images/floodsafe-brand.png"/>

  <title>FloodSafe · Nairobi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="floodsafe-loading" role="status" aria-live="polite"
       style="position:fixed;inset:0;z-index:9999;display:grid;place-content:center;padding:24px;background:#F7F8F4;color:#163B46;font-family:Georgia,serif;text-align:center">
    <h1 style="font-size:36px;margin:0 0 16px">FloodSafe</h1>
    <p>Loading your FloodSafe app…</p>
    <p id="floodsafe-retry" hidden>Taking longer than usual? <a href="" style="color:#087F8C">Reload the page</a>.</p>
  </div>
  <noscript>Turn on JavaScript in your browser to open FloodSafe.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('floodsafe-loading')?.remove();
    }, {once: true});
    setTimeout(function () {
      const retry = document.getElementById('floodsafe-retry');
      if (retry) retry.hidden = false;
    }, 15000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
